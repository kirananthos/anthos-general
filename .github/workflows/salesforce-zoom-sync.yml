name: Sync Salesforce contacts to Zoom

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salesforce-zoom-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        id: sync
        env:
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_TOKEN: ${{ secrets.SALESFORCE_TOKEN }}
          SALESFORCE_REPORT_ID: ${{ secrets.SALESFORCE_REPORT_ID }}
        run: python sync.py

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STAFF_SLACK_USER_ID: ${{ secrets.STAFF_SLACK_USER_ID }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADDED: ${{ steps.sync.outputs.added_count }}
          DELETED: ${{ steps.sync.outputs.deleted_count }}
          FAILED: ${{ steps.sync.outputs.failed_count }}
          ALREADY_EXISTS: ${{ steps.sync.outputs.already_exists_count }}
          INVALID_PHONE: ${{ steps.sync.outputs.invalid_phone_count }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI=":white_check_mark:"
            HEADLINE="Salesforce → Zoom contact sync succeeded"
          else
            EMOJI=":x:"
            HEADLINE="Salesforce → Zoom contact sync failed"
          fi
          TEXT="<@${STAFF_SLACK_USER_ID}> $EMOJI $HEADLINE\n• Added: ${ADDED:-0}\n• Deleted: ${DELETED:-0}\n• Failed: ${FAILED:-0}\n• Skipped (already exists): ${ALREADY_EXISTS:-0}\n• Skipped (invalid phone): ${INVALID_PHONE:-0}\n<$RUN_URL|View run logs>"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"$TEXT\"}" \
            "$SLACK_WEBHOOK_URL"
